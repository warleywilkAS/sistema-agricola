{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-calendar-range"></i> Escolha a Safra
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Selecione a qual safra este formulário se refere. Todos os registros ficam organizados por safra, e você pode exportar os dados de cada uma separadamente.</p>
                <form method="get" action="{{ url_for('form') }}">
                    <div class="mb-4">
                        <label class="form-label">SAFRA</label>
                        <select name="safra" class="form-select form-select-lg" required>
                            <option value="">Selecione...</option>
                            {% for s in safras %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-arrow-right-circle"></i> Continuar para o formulário
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
